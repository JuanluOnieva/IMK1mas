# about
about:
  enable: true
  title: "\n¿Quiénes somos?"
  content: 
    "Somos un equipo multidisciplinario de investigadores, analistas y profesionales especializados en bioinformática, biología computacional, genómica, transcriptómica, proteómica y análisis de datos ómicos. Formamos parte del Centro de Investigación en Tecnologías y Ciencias Aplicadas (CITAC), compartiendo su compromiso con la excelencia científica, la innovación y la formación de talento humano.
    <br/><br/>
    Nuestra unidad se caracteriza por:
    <ul class='about-list'>
    <li>Un enfoque científico riguroso y reproducible.</li>
    <li>El uso de metodologías y estándares internacionales.</li>
    <li>La colaboración abierta y el trabajo en red.</li>
    <li>La adaptación de soluciones bioinformáticas a problemáticas reales.</li>
    </ul>"
  content2: 
    Estudiante del Programa de Doctorado en Biomedicina, Investigación Traslacional y Nuevas Tecnologías en Salud por la Universidad de Málaga. Su tesis doctoral en bioinformática pretende utilizar la integración de datos ómicos procedentes de distintos niveles moleculares para avanzar en el campo de la inmunoterapia y ofrecer nuevas esperanzas para tratamientos más efectivos.
    <br/><br/>
    Involucrado de forma activa en <b>IMMUNOMARK UNO MÁS</b>, participará con RealBuzz en la Media Maratón de Copenhagen 2024 para promocionar esta causa benéfica. 


