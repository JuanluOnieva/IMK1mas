# showcase
showcase:
  enable: true
  title: "\nBioinformática aplicada al desarrollo científico y tecnológico"
  subtitle: ""
  description: "La Unidad de Bioinformática Aplicada del CITAC es un espacio interdisciplinario dedicado al análisis, integración e interpretación de datos biológicos complejos mediante herramientas computacionales avanzadas. Nuestro objetivo es transformar grandes volúmenes de datos en conocimiento accionable que impulse la investigación científica, la innovación tecnológica y la toma de decisiones basada en evidencia.
  Trabajamos en la intersección entre la biología, la informática, la estadística y las ciencias de datos, colaborando estrechamente con grupos de investigación, instituciones académicas y aliados estratégicos a nivel nacional e internacional..
  <br/><br/>"
  
  button:
    icon: "icon-info-fill"
    btnText: "Solicitud de Análisis"
